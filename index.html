<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen Fight - Classroom Duel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a0f0a;
            font-family: 'Georgia', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: default;
        }

        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #score-display {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 40px;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .score-card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px 24px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .score-card.blue {
            border-color: rgba(66, 133, 244, 0.4);
        }

        .score-card.silver {
            border-color: rgba(192, 192, 192, 0.4);
        }

        .score-card h3 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        .score-card.blue h3 { color: #6ba3ff; }
        .score-card.silver h3 { color: #c0c0c0; }

        .score-card .score {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .vs-text {
            color: rgba(255,255,255,0.3);
            font-size: 14px;
            font-weight: bold;
        }

        #turn-indicator {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 14px;
            letter-spacing: 1px;
            display: none;
            z-index: 20;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.15);
        }

        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: radial-gradient(ellipse at center, rgba(40,25,15,0.95) 0%, rgba(10,5,2,0.98) 100%);
        }

        #start-screen h1 {
            font-size: clamp(36px, 8vw, 72px);
            color: #f4e4c1;
            text-shadow: 0 4px 20px rgba(255,200,100,0.3);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        #start-screen .subtitle {
            color: rgba(244,228,193,0.5);
            font-size: clamp(12px, 2.5vw, 18px);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        #start-screen .instructions {
            color: rgba(244,228,193,0.6);
            font-size: 14px;
            text-align: center;
            line-height: 2;
            margin-bottom: 40px;
            max-width: 400px;
        }

        .start-btn {
            background: linear-gradient(135deg, #c8956c, #a06b3e);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 18px;
            font-family: 'Georgia', serif;
            letter-spacing: 3px;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: all;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(160,107,62,0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(160,107,62,0.6);
        }

        #game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: radial-gradient(ellipse at center, rgba(40,25,15,0.95) 0%, rgba(10,5,2,0.98) 100%);
        }

        #game-over-screen h2 {
            font-size: clamp(28px, 6vw, 52px);
            color: #f4e4c1;
            margin-bottom: 15px;
            letter-spacing: 3px;
        }

        #game-over-screen .winner-text {
            color: rgba(244,228,193,0.6);
            font-size: 18px;
            margin-bottom: 40px;
        }

        .power-meter {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 200px;
            background: rgba(0,0,0,0.5);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            z-index: 20;
            overflow: hidden;
            pointer-events: none;
        }

        .power-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #4CAF50, #FFC107, #f44336);
            border-radius: 10px;
            transition: height 0.05s;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="score-display">
        <div class="score-card blue">
            <h3>Blue Gel</h3>
            <div class="score" id="score1">0</div>
        </div>
        <div class="vs-text">VS</div>
        <div class="score-card silver">
            <h3>Silver Cap</h3>
            <div class="score" id="score2">0</div>
        </div>
    </div>

    <div id="turn-indicator">Drag your pen to flick!</div>

    <div class="power-meter" id="powerMeter">
        <div class="power-fill" id="powerFill"></div>
    </div>

    <div id="start-screen">
        <h1>PEN FIGHT</h1>
        <div class="subtitle">Classroom Duel</div>
        <div class="instructions">
            Drag & release your pen to flick it<br>
            Push your opponent's pen off the desk<br>
            First to 3 wins takes the match!
        </div>
        <button class="start-btn" onclick="startGame()">PLAY</button>
    </div>

    <div id="game-over-screen">
        <h2 id="winner-title">GAME OVER</h2>
        <div class="winner-text" id="winner-text"></div>
        <button class="start-btn" onclick="startGame()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let W, H, scale;
        let gameState = 'start'; // start, playing, flicking, settling, roundEnd, gameOver
        let currentPlayer = 1;
        let scores = [0, 0];
        let maxScore = 3;

        // Desk dimensions (relative to canvas)
        let desk = { x: 0, y: 0, w: 0, h: 0 };

        // Pens
        let pens = [];
        let dragging = false;
        let dragStart = { x: 0, y: 0 };
        let dragCurrent = { x: 0, y: 0 };
        let flickPower = 0;
        let flickAngle = 0;

        // Particles
        let dustMotes = [];
        let impactParticles = [];
        let lightRays = [];

        // Audio context
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'flick') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'hit') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
                // Add noise burst
                const noise = audioCtx.createBufferSource();
                const bufferSize = audioCtx.sampleRate * 0.1;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.1));
                }
                noise.buffer = buffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                noise.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noise.start();
            } else if (type === 'fall') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'win') {
                const notes = [523, 659, 784, 1047];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'sine';
                    o.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.15);
                    g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.15 + 0.3);
                    o.start(audioCtx.currentTime + i * 0.15);
                    o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                });
            }
        }

        function resize() {
            W = canvas.width = window.innerWidth * window.devicePixelRatio;
            H = canvas.height = window.innerHeight * window.devicePixelRatio;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            scale = Math.min(W, H) / 800;

            // Desk takes up most of the screen
            desk.w = W * 0.75;
            desk.h = H * 0.6;
            desk.x = (W - desk.w) / 2;
            desk.y = (H - desk.h) / 2 + H * 0.05;
        }

        function createPen(type, x, y) {
            const penLength = 120 * scale;
            const penWidth = 12 * scale;
            return {
                type: type,
                x: x,
                y: y,
                angle: type === 'blue' ? 0 : Math.PI,
                length: penLength,
                width: penWidth,
                vx: 0,
                vy: 0,
                va: 0, // angular velocity
                friction: 0.97,
                angularFriction: 0.94,
                alive: true,
                falling: false,
                fallProgress: 0,
                opacity: 1
            };
        }

        function initPens() {
            const centerX = desk.x + desk.w / 2;
            const centerY = desk.y + desk.h / 2;
            pens = [
                createPen('blue', centerX - desk.w * 0.25, centerY),
                createPen('silver', centerX + desk.w * 0.25, centerY)
            ];
        }

        function resetPensForRound() {
            const centerX = desk.x + desk.w / 2;
            const centerY = desk.y + desk.h / 2;
            pens[0].x = centerX - desk.w * 0.25;
            pens[0].y = centerY;
            pens[0].angle = 0;
            pens[0].vx = 0;
            pens[0].vy = 0;
            pens[0].va = 0;
            pens[0].alive = true;
            pens[0].falling = false;
            pens[0].fallProgress = 0;
            pens[0].opacity = 1;

            pens[1].x = centerX + desk.w * 0.25;
            pens[1].y = centerY;
            pens[1].angle = Math.PI;
            pens[1].vx = 0;
            pens[1].vy = 0;
            pens[1].va = 0;
            pens[1].alive = true;
            pens[1].falling = false;
            pens[1].fallProgress = 0;
            pens[1].opacity = 1;

            currentPlayer = 1;
            gameState = 'playing';
            updateTurnIndicator();
        }

        function initDustMotes() {
            dustMotes = [];
            for (let i = 0; i < 40; i++) {
                dustMotes.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: Math.random() * 3 * scale + 1,
                    speed: Math.random() * 0.3 + 0.1,
                    opacity: Math.random() * 0.4 + 0.1,
                    phase: Math.random() * Math.PI * 2
                });
            }
        }

        function initLightRays() {
            lightRays = [];
            for (let i = 0; i < 5; i++) {
                lightRays.push({
                    x: W * 0.1 + Math.random() * W * 0.5,
                    width: 30 + Math.random() * 80,
                    opacity: 0.03 + Math.random() * 0.04
                });
            }
        }

        function getPenEndpoints(pen) {
            const halfLen = pen.length / 2;
            const cos = Math.cos(pen.angle);
            const sin = Math.sin(pen.angle);
            return {
                x1: pen.x - cos * halfLen,
                y1: pen.y - sin * halfLen,
                x2: pen.x + cos * halfLen,
                y2: pen.y + sin * halfLen
            };
        }

        function pointToSegmentDist(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            const projX = x1 + t * dx;
            const projY = y1 + t * dy;
            return Math.hypot(px - projX, py - projY);
        }

        function segmentToSegmentDist(a, b) {
            const ae = getPenEndpoints(a);
            const be = getPenEndpoints(b);
            // Check distances between endpoints and other segment
            let minDist = Infinity;
            // Endpoint to segment distances
            const d1 = pointToSegmentDist(ae.x1, ae.y1, be.x1, be.y1, be.x2, be.y2);
            const d2 = pointToSegmentDist(ae.x2, ae.y2, be.x1, be.y1, be.x2, be.y2);
            const d3 = pointToSegmentDist(be.x1, be.y1, ae.x1, ae.y1, ae.x2, ae.y2);
            const d4 = pointToSegmentDist(be.x2, be.y2, ae.x1, ae.y1, ae.x2, ae.y2);
            // Also center to center
            const dc = Math.hypot(a.x - b.x, a.y - b.y);
            minDist = Math.min(d1, d2, d3, d4, dc);
            return minDist;
        }

        function checkPenCollision() {
            if (!pens[0].alive || !pens[1].alive) return;
            if (pens[0].falling || pens[1].falling) return;

            const dist = segmentToSegmentDist(pens[0], pens[1]);
            const minDist = (pens[0].width + pens[1].width) * 0.7;

            if (dist < minDist) {
                // Collision!
                const dx = pens[1].x - pens[0].x;
                const dy = pens[1].y - pens[0].y;
                const d = Math.hypot(dx, dy);
                if (d === 0) return;

                const nx = dx / d;
                const ny = dy / d;

                // Relative velocity
                const dvx = pens[0].vx - pens[1].vx;
                const dvy = pens[0].vy - pens[1].vy;
                const dvn = dvx * nx + dvy * ny;

                if (dvn > 0) {
                    const restitution = 0.7;
                    const impulse = dvn * restitution;

                    pens[0].vx -= impulse * nx;
                    pens[0].vy -= impulse * ny;
                    pens[1].vx += impulse * nx;
                    pens[1].vy += impulse * ny;

                    // Add some spin
                    pens[0].va += (Math.random() - 0.5) * 0.1;
                    pens[1].va += (Math.random() - 0.5) * 0.1;

                    // Separate pens
                    const overlap = minDist - dist;
                    pens[0].x -= nx * overlap * 0.5;
                    pens[0].y -= ny * overlap * 0.5;
                    pens[1].x += nx * overlap * 0.5;
                    pens[1].y += ny * overlap * 0.5;

                    // Impact particles
                    const impactX = (pens[0].x + pens[1].x) / 2;
                    const impactY = (pens[0].y + pens[1].y) / 2;
                    for (let i = 0; i < 8; i++) {
                        impactParticles.push({
                            x: impactX,
                            y: impactY,
                            vx: (Math.random() - 0.5) * 8 * scale,
                            vy: (Math.random() - 0.5) * 8 * scale,
                            life: 1,
                            size: Math.random() * 4 * scale + 2
                        });
                    }

                    playSound('hit');
                }
            }
        }

        function isPenOffDesk(pen) {
            const ep = getPenEndpoints(pen);
            const margin = pen.width;
            // Check if center and both endpoints are off the desk
            const points = [
                { x: pen.x, y: pen.y },
                { x: ep.x1, y: ep.y1 },
                { x: ep.x2, y: ep.y2 }
            ];

            let offCount = 0;
            for (const p of points) {
                if (p.x < desk.x - margin || p.x > desk.x + desk.w + margin ||
                    p.y < desk.y - margin || p.y > desk.y + desk.h + margin) {
                    offCount++;
                }
            }
            return offCount >= 2;
        }

        function updatePens() {
            let anyMoving = false;

            for (let i = 0; i < pens.length; i++) {
                const pen = pens[i];
                if (!pen.alive) continue;

                if (pen.falling) {
                    pen.fallProgress += 0.02;
                    pen.opacity = Math.max(0, 1 - pen.fallProgress);
                    pen.vy += 2 * scale;
                    pen.y += pen.vy;
                    pen.angle += pen.va;
                    if (pen.fallProgress >= 1) {
                        pen.alive = false;
                    }
                    anyMoving = true;
                    continue;
                }

                // Apply velocity
                pen.x += pen.vx;
                pen.y += pen.vy;
                pen.angle += pen.va;

                // Apply friction
                pen.vx *= pen.friction;
                pen.vy *= pen.friction;
                pen.va *= pen.angularFriction;

                // Stop if very slow
                if (Math.abs(pen.vx) < 0.01) pen.vx = 0;
                if (Math.abs(pen.vy) < 0.01) pen.vy = 0;
                if (Math.abs(pen.va) < 0.001) pen.va = 0;

                if (Math.abs(pen.vx) > 0.1 || Math.abs(pen.vy) > 0.1) {
                    anyMoving = true;
                }

                // Check if off desk
                if (isPenOffDesk(pen)) {
                    pen.falling = true;
                    pen.vy += 3 * scale;
                    pen.va += (Math.random() - 0.5) * 0.2;
                    playSound('fall');
                }
            }

            // Check collisions
            checkPenCollision();

            // Update particles
            for (let i = impactParticles.length - 1; i >= 0; i--) {
                const p = impactParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.92;
                p.vy *= 0.92;
                p.life -= 0.03;
                if (p.life <= 0) {
                    impactParticles.splice(i, 1);
                }
            }

            return anyMoving;
        }

        function updateDustMotes(time) {
            for (const mote of dustMotes) {
                mote.y -= mote.speed;
                mote.x += Math.sin(time * 0.001 + mote.phase) * 0.3;
                if (mote.y < -10) {
                    mote.y = H + 10;
                    mote.x = Math.random() * W;
                }
            }
        }

        // Drawing functions
        function drawBackground(time) {
            // Classroom background - warm tones
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#2d1f14');
            grad.addColorStop(0.3, '#3d2a1a');
            grad.addColorStop(1, '#1a0f0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Background students (blurred, soft shapes)
            drawBackgroundStudents(time);

            // Light rays
            for (const ray of lightRays) {
                const rayGrad = ctx.createLinearGradient(ray.x, 0, ray.x + ray.width, H);
                rayGrad.addColorStop(0, `rgba(255, 230, 180, ${ray.opacity * 1.5})`);
                rayGrad.addColorStop(0.5, `rgba(255, 220, 160, ${ray.opacity})`);
                rayGrad.addColorStop(1, `rgba(255, 210, 140, 0)`);
                ctx.fillStyle = rayGrad;
                ctx.beginPath();
                ctx.moveTo(ray.x, 0);
                ctx.lineTo(ray.x + ray.width * 3, H);
                ctx.lineTo(ray.x + ray.width * 3 + ray.width, H);
                ctx.lineTo(ray.x + ray.width, 0);
                ctx.closePath();
                ctx.fill();
            }

            // Dust motes
            for (const mote of dustMotes) {
                ctx.beginPath();
                ctx.arc(mote.x, mote.y, mote.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 230, 180, ${mote.opacity * (0.5 + 0.5 * Math.sin(time * 0.002 + mote.phase))})`;
                ctx.fill();
            }
        }

        function drawBackgroundStudents(time) {
            // Soft blurred student silhouettes
            const students = [
                { x: W * 0.1, y: H * 0.15, size: 50 },
                { x: W * 0.25, y: H * 0.1, size: 45 },
                { x: W * 0.75, y: H * 0.12, size: 48 },
                { x: W * 0.9, y: H * 0.14, size: 44 },
                { x: W * 0.5, y: H * 0.08, size: 42 },
            ];

            for (const s of students) {
                const bob = Math.sin(time * 0.001 + s.x) * 2;
                // Head
                ctx.beginPath();
                ctx.arc(s.x, s.y + bob, s.size * scale * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(60, 40, 30, 0.3)';
                ctx.fill();
                // Body
                ctx.beginPath();
                ctx.ellipse(s.x, s.y + s.size * scale * 0.7 + bob, s.size * scale * 0.5, s.size * scale * 0.6, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(50, 35, 25, 0.25)';
                ctx.fill();
            }
        }

        function drawDesk() {
            // Desk shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(desk.x + 10 * scale, desk.y + 10 * scale, desk.w, desk.h);

            // Main desk surface - wood texture
            const woodGrad = ctx.createLinearGradient(desk.x, desk.y, desk.x + desk.w, desk.y + desk.h);
            woodGrad.addColorStop(0, '#8B6914');
            woodGrad.addColorStop(0.2, '#A0782C');
            woodGrad.addColorStop(0.4, '#9B7028');
            woodGrad.addColorStop(0.6, '#A8802E');
            woodGrad.addColorStop(0.8, '#9B7028');
            woodGrad.addColorStop(1, '#8B6914');
            ctx.fillStyle = woodGrad;

            // Rounded desk
            const r = 10 * scale;
            ctx.beginPath();
            ctx.roundRect(desk.x, desk.y, desk.w, desk.h, r);
            ctx.fill();

            // Wood grain lines
            ctx.strokeStyle = 'rgba(80, 50, 10, 0.15)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                const y = desk.y + (desk.h / 20) * i + Math.sin(i * 0.5) * 5;
                ctx.beginPath();
                ctx.moveTo(desk.x, y);
                for (let x = desk.x; x < desk.x + desk.w; x += 20) {
                    ctx.lineTo(x, y + Math.sin(x * 0.01 + i) * 3);
                }
                ctx.stroke();
            }

            // Scratches
            ctx.strokeStyle = 'rgba(120, 90, 40, 0.2)';
            ctx.lineWidth = 0.5;
            const scratches = [
                [0.2, 0.3, 0.35, 0.35],
                [0.5, 0.5, 0.6, 0.45],
                [0.7, 0.6, 0.8, 0.7],
                [0.3, 0.7, 0.4, 0.65],
                [0.6, 0.2, 0.65, 0.3],
            ];
            for (const s of scratches) {
                ctx.beginPath();
                ctx.moveTo(desk.x + desk.w * s[0], desk.y + desk.h * s[1]);
                ctx.lineTo(desk.x + desk.w * s[2], desk.y + desk.h * s[3]);
                ctx.stroke();
            }

            // Varnish reflection
            const varnishGrad = ctx.createLinearGradient(desk.x, desk.y, desk.x, desk.y + desk.h * 0.4);
            varnishGrad.addColorStop(0, 'rgba(255, 255, 255, 0.08)');
            varnishGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = varnishGrad;
            ctx.beginPath();
            ctx.roundRect(desk.x, desk.y, desk.w, desk.h, r);
            ctx.fill();

            // Desk edge highlight
            ctx.strokeStyle = 'rgba(160, 120, 60, 0.5)';
            ctx.lineWidth = 2 * scale;
            ctx.beginPath();
            ctx.roundRect(desk.x, desk.y, desk.w, desk.h, r);
            ctx.stroke();

            // Edge thickness
            ctx.fillStyle = '#6B4E0A';
            ctx.beginPath();
            ctx.roundRect(desk.x, desk.y + desk.h, desk.w, 8 * scale, [0, 0, r, r]);
            ctx.fill();
        }

        function drawPen(pen, time) {
            if (!pen.alive && !pen.falling) return;

            ctx.save();
            ctx.translate(pen.x, pen.y);
            ctx.rotate(pen.angle);
            ctx.globalAlpha = pen.opacity;

            if (pen.falling) {
                ctx.scale(1 - pen.fallProgress * 0.3, 1 - pen.fallProgress * 0.3);
            }

            const halfLen = pen.length / 2;
            const halfW = pen.width / 2;

            if (pen.type === 'blue') {
                // Blue gel pen
                // Main body
                const bodyGrad = ctx.createLinearGradient(0, -halfW, 0, halfW);
                bodyGrad.addColorStop(0, '#5B9BD5');
                bodyGrad.addColorStop(0.3, '#2E75B6');
                bodyGrad.addColorStop(0.7, '#1F4E79');
                bodyGrad.addColorStop(1, '#2E75B6');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(-halfLen, -halfW, pen.length, pen.width, 4 * scale);
                ctx.fill();

                // Clip
                ctx.fillStyle = '#C0C0C0';
                ctx.fillRect(halfLen - 25 * scale, -halfW - 2 * scale, 20 * scale, 3 * scale);

                // Tip
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(-halfLen, -halfW * 0.4);
                ctx.lineTo(-halfLen - 8 * scale, 0);
                ctx.lineTo(-halfLen, halfW * 0.4);
                ctx.closePath();
                ctx.fill();

                // Cap end
                ctx.fillStyle = '#1a4a7a';
                ctx.beginPath();
                ctx.roundRect(halfLen - 15 * scale, -halfW, 15 * scale, pen.width, [0, 4 * scale, 4 * scale, 0]);
                ctx.fill();

                // Gel ink window
                ctx.fillStyle = 'rgba(0, 100, 200, 0.5)';
                ctx.fillRect(-halfLen + 20 * scale, -halfW + 2 * scale, 30 * scale, pen.width - 4 * scale);

                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(-halfLen + 5 * scale, -halfW + 1 * scale, pen.length - 20 * scale, 3 * scale);

                // Glow when active
                if (gameState === 'playing' && currentPlayer === 1 && !pen.falling) {
                    ctx.shadowColor = '#4A90D9';
                    ctx.shadowBlur = 15 * scale + Math.sin(time * 0.005) * 5 * scale;
                    ctx.strokeStyle = 'rgba(74, 144, 217, 0.4)';
                    ctx.lineWidth = 2 * scale;
                    ctx.beginPath();
                    ctx.roundRect(-halfLen - 2, -halfW - 2, pen.length + 4, pen.width + 4, 6 * scale);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            } else {
                // Silver metallic pen
                // Main body
                const bodyGrad = ctx.createLinearGradient(0, -halfW, 0, halfW);
                bodyGrad.addColorStop(0, '#E8E8E8');
                bodyGrad.addColorStop(0.3, '#C0C0C0');
                bodyGrad.addColorStop(0.5, '#A8A8A8');
                bodyGrad.addColorStop(0.7, '#C0C0C0');
                bodyGrad.addColorStop(1, '#909090');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.roundRect(-halfLen, -halfW, pen.length, pen.width, 4 * scale);
                ctx.fill();

                // Metallic cap
                const capGrad = ctx.createLinearGradient(0, -halfW, 0, halfW);
                capGrad.addColorStop(0, '#D4D4D4');
                capGrad.addColorStop(0.5, '#808080');
                capGrad.addColorStop(1, '#B0B0B0');
                ctx.fillStyle = capGrad;
                ctx.beginPath();
                ctx.roundRect(-halfLen, -halfW, pen.length * 0.45, pen.width, [4 * scale, 0, 0, 4 * scale]);
                ctx.fill();

                // Cap ring
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(-halfLen + pen.length * 0.44, -halfW, 3 * scale, pen.width);

                // Tip
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.moveTo(halfLen, -halfW * 0.4);
                ctx.lineTo(halfLen + 8 * scale, 0);
                ctx.lineTo(halfLen, halfW * 0.4);
                ctx.closePath();
                ctx.fill();

                // Clip
                ctx.fillStyle = '#D4AF37';
                ctx.fillRect(halfLen - 25 * scale, -halfW - 2 * scale, 20 * scale, 3 * scale);

                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(-halfLen + 5 * scale, -halfW + 1 * scale, pen.length - 20 * scale, 2.5 * scale);

                // Ring details
                ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(halfLen - 10 * scale, -halfW);
                ctx.lineTo(halfLen - 10 * scale, halfW);
                ctx.stroke();

                // Glow when active
                if (gameState === 'playing' && currentPlayer === 2 && !pen.falling) {
                    ctx.shadowColor = '#C0C0C0';
                    ctx.shadowBlur = 15 * scale + Math.sin(time * 0.005) * 5 * scale;
                    ctx.strokeStyle = 'rgba(192, 192, 192, 0.4)';
                    ctx.lineWidth = 2 * scale;
                    ctx.beginPath();
                    ctx.roundRect(-halfLen - 2, -halfW - 2, pen.length + 4, pen.width + 4, 6 * scale);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
            }

            ctx.restore();
        }

        function drawAimLine() {
            if (!dragging) return;

            const pen = pens[currentPlayer - 1];
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);
            const maxDist = 200 * scale;
            const power = Math.min(dist / maxDist, 1);

            // Direction line
            const angle = Math.atan2(dy, dx);
            const lineLen = power * 150 * scale;

            ctx.save();
            ctx.setLineDash([5 * scale, 5 * scale]);
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + power * 0.4})`;
            ctx.lineWidth = 2 * scale;
            ctx.beginPath();
            ctx.moveTo(pen.x, pen.y);
            ctx.lineTo(pen.x + Math.cos(angle) * lineLen, pen.y + Math.sin(angle) * lineLen);
            ctx.stroke();
            ctx.setLineDash([]);

            // Arrow head
            const arrowX = pen.x + Math.cos(angle) * lineLen;
            const arrowY = pen.y + Math.sin(angle) * lineLen;
            ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + power * 0.5})`;
            ctx.beginPath();
            ctx.moveTo(arrowX, arrowY);
            ctx.lineTo(arrowX - Math.cos(angle - 0.3) * 10 * scale, arrowY - Math.sin(angle - 0.3) * 10 * scale);
            ctx.lineTo(arrowX - Math.cos(angle + 0.3) * 10 * scale, arrowY - Math.sin(angle + 0.3) * 10 * scale);
            ctx.closePath();
            ctx.fill();

            ctx.restore();

            // Update power meter
            document.getElementById('powerFill').style.height = (power * 100) + '%';
        }

        function drawImpactParticles() {
            for (const p of impactParticles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 150, ${p.life * 0.8})`;
                ctx.fill();
            }
        }

        function drawShadows() {
            for (const pen of pens) {
                if (!pen.alive && !pen.falling) continue;
                ctx.save();
                ctx.translate(pen.x + 5 * scale, pen.y + 8 * scale);
                ctx.rotate(pen.angle);
                ctx.globalAlpha = 0.2 * pen.opacity;
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.roundRect(-pen.length / 2, -pen.width / 2, pen.length, pen.width, 4 * scale);
                ctx.fill();
                ctx.restore();
            }
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turn-indicator');
            if (gameState === 'playing') {
                indicator.style.display = 'block';
                if (currentPlayer === 1) {
                    indicator.textContent = '🔵 Blue Gel Pen - Drag to flick!';
                    indicator.style.borderColor = 'rgba(66, 133, 244, 0.4)';
                } else {
                    indicator.textContent = '⚪ Silver Cap Pen - Drag to flick!';
                    indicator.style.borderColor = 'rgba(192, 192, 192, 0.4)';
                }
            } else {
                indicator.style.display = 'none';
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function isPointNearPen(px, py, pen) {
            const ep = getPenEndpoints(pen);
            const dist = pointToSegmentDist(px, py, ep.x1, ep.y1, ep.x2, ep.y2);
            return dist < pen.width * 3;
        }

        function onPointerDown(e) {
            e.preventDefault();
            if (gameState !== 'playing') return;
            initAudio();

            const pos = getMousePos(e);
            const pen = pens[currentPlayer - 1];

            if (isPointNearPen(pos.x, pos.y, pen)) {
                dragging = true;
                dragStart = { x: pos.x, y: pos.y };
                dragCurrent = { x: pos.x, y: pos.y };
                document.getElementById('powerMeter').style.display = 'block';
            }
        }

        function onPointerMove(e) {
            e.preventDefault();
            if (!dragging) return;
            const pos = getMousePos(e);
            dragCurrent = { x: pos.x, y: pos.y };
        }

        function onPointerUp(e) {
            e.preventDefault();
            if (!dragging) return;
            dragging = false;
            document.getElementById('powerMeter').style.display = 'none';

            const pen = pens[currentPlayer - 1];
            const dx = dragStart.x - dragCurrent.x;
            const dy = dragStart.y - dragCurrent.y;
            const dist = Math.hypot(dx, dy);
            const maxDist = 200 * scale;
            const power = Math.min(dist / maxDist, 1);

            if (power > 0.05) {
                const maxSpeed = 25 * scale;
                const angle = Math.atan2(dy, dx);
                pen.vx = Math.cos(angle) * power * maxSpeed;
                pen.vy = Math.sin(angle) * power * maxSpeed;
                pen.va = (Math.random() - 0.5) * power * 0.15;

                playSound('flick');
                gameState = 'settling';
                document.getElementById('turn-indicator').style.display = 'none';
            }
        }

        // Event listeners
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp, { passive: false });

        window.addEventListener('resize', () => {
            resize();
            if (gameState === 'start' || gameState === 'gameOver') {
                initPens();
            }
        });

        function startGame() {
            initAudio();
            scores = [0, 0];
            document.getElementById('score1').textContent = '0';
            document.getElementById('score2').textContent = '0';
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('score-display').style.display = 'flex';
            initPens();
            currentPlayer = 1;
            gameState = 'playing';
            updateTurnIndicator();
        }

        function handleRoundEnd() {
            let loser = -1;
            if (!pens[0].alive && !pens[0].falling) loser = 0;
            if (!pens[1].alive && !pens[1].falling) loser = 1;

            if (loser === -1) return false;

            // The other player scores
            const winner = loser === 0 ? 1 : 0;
            scores[winner]++;
            document.getElementById('score' + (winner + 1)).textContent = scores[winner];

            if (scores[winner] >= maxScore) {
                // Game over!
                setTimeout(() => {
                    gameState = 'gameOver';
                    const winnerName = winner === 0 ? 'Blue Gel Pen' : 'Silver Cap Pen';
                    document.getElementById('winner-title').textContent = '🏆 VICTORY!';
                    document.getElementById('winner-text').textContent = winnerName + ' wins the match!';
                    document.getElementById('game-over-screen').style.display = 'flex';
                    document.getElementById('score-display').style.display = 'none';
                    document.getElementById('turn-indicator').style.display = 'none';
                    playSound('win');
                }, 1000);
            } else {
                // Next round
                setTimeout(() => {
                    resetPensForRound();
                }, 1500);
            }

            gameState = 'roundEnd';
            return true;
        }

        let lastTime = 0;
        function gameLoop(time) {
            const dt = time - lastTime;
            lastTime = time;

            // Clear
            ctx.clearRect(0, 0, W, H);

            // Update
            updateDustMotes(time);

            if (gameState === 'settling' || gameState === 'roundEnd') {
                const moving = updatePens();
                if (!moving && gameState === 'settling') {
                    // Check if any pen fell
                    const anyFell = pens.some(p => !p.alive);
                    if (anyFell) {
                        handleRoundEnd();
                    } else {
                        // Switch turns
                        currentPlayer = currentPlayer === 1 ? 2 : 1;
                        gameState = 'playing';
                        updateTurnIndicator();
                    }
                }
                if (gameState === 'roundEnd') {
                    updatePens(); // Continue animating falls
                    handleRoundEnd();
                }
            }

            // Draw
            drawBackground(time);
            drawDesk();
            drawShadows();

            // Draw pens
            drawPen(pens[0], time);
            drawPen(pens[1], time);

            drawImpactParticles();
            drawAimLine();

            // Vignette
            const vigGrad = ctx.createRadialGradient(W / 2, H / 2, W * 0.3, W / 2, H / 2, W * 0.7);
            vigGrad.addColorStop(0, 'rgba(0,0,0,0)');
            vigGrad.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = vigGrad;
            ctx.fillRect(0, 0, W, H);

            requestAnimationFrame(gameLoop);
        }

        // Initialize
        resize();
        initPens();
        initDustMotes();
        initLightRays();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
